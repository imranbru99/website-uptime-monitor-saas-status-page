<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="380" rx="12" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">5 Independent Filament v5 Panels</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Tailored user experiences and strict permission boundaries for every organizational stakeholder</text>
  </g>

  <!-- 5 Columns for 5 Panels -->
  <g transform="translate(40, 80)">
    <!-- Panel 1: Platform Superadmin -->
    <rect width="192" height="260" rx="10" fill="#0B132B" stroke="#38BDF8" stroke-width="1.2"/>
    <rect x="0" y="0" width="192" height="38" rx="10" fill="#0C4A6E"/>
    <text x="96" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#BAE6FD" text-anchor="middle">PLATFORM ADMIN</text>
    
    <text x="16" y="62" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Route: /platform</text>
    <text x="16" y="80" font-family="sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Superadmins</text>
    <text x="16" y="106" font-family="sans-serif" font-size="11" fill="#94A3B8">• Multi-tenant accounts</text>
    <text x="16" y="126" font-family="sans-serif" font-size="11" fill="#94A3B8">• 60-Module defaults</text>
    <text x="16" y="146" font-family="sans-serif" font-size="11" fill="#94A3B8">• Global 8 probe nodes</text>
    <text x="16" y="166" font-family="sans-serif" font-size="11" fill="#94A3B8">• Subscription tiers</text>
    <text x="16" y="186" font-family="sans-serif" font-size="11" fill="#94A3B8">• System telemetry</text>
    <rect x="16" y="218" width="160" height="24" rx="4" fill="#0F172A"/>
    <text x="96" y="234" font-family="sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">SaaS Governance</text>

    <!-- Panel 2: Business Owner -->
    <g transform="translate(206, 0)">
      <rect width="192" height="260" rx="10" fill="#0B132B" stroke="#10B981" stroke-width="1.2"/>
      <rect x="0" y="0" width="192" height="38" rx="10" fill="#064E3B"/>
      <text x="96" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#A7F3D0" text-anchor="middle">BUSINESS OWNER</text>
      
      <text x="16" y="62" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Route: /app</text>
      <text x="16" y="80" font-family="sans-serif" font-size="11" font-weight="600" fill="#10B981">Tenant Admins</text>
      <text x="16" y="106" font-family="sans-serif" font-size="11" fill="#94A3B8">• 10 synthetic probe types</text>
      <text x="16" y="126" font-family="sans-serif" font-size="11" fill="#94A3B8">• Incident command</text>
      <text x="16" y="146" font-family="sans-serif" font-size="11" fill="#94A3B8">• AI Copilot & RCA</text>
      <text x="16" y="166" font-family="sans-serif" font-size="11" fill="#94A3B8">• Public status pages</text>
      <text x="16" y="186" font-family="sans-serif" font-size="11" fill="#94A3B8">• 60-Module manager</text>
      <rect x="16" y="218" width="160" height="24" rx="4" fill="#0F172A"/>
      <text x="96" y="234" font-family="sans-serif" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Full SaaS Control</text>
    </g>

    <!-- Panel 3: Branch Operations -->
    <g transform="translate(412, 0)">
      <rect width="192" height="260" rx="10" fill="#0B132B" stroke="#F59E0B" stroke-width="1.2"/>
      <rect x="0" y="0" width="192" height="38" rx="10" fill="#78350F"/>
      <text x="96" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#FDE68A" text-anchor="middle">BRANCH OPS</text>
      
      <text x="16" y="62" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Route: /branch</text>
      <text x="16" y="80" font-family="sans-serif" font-size="11" font-weight="600" fill="#F59E0B">Regional Leads</text>
      <text x="16" y="106" font-family="sans-serif" font-size="11" fill="#94A3B8">• Regional monitors</text>
      <text x="16" y="126" font-family="sans-serif" font-size="11" fill="#94A3B8">• Branch on-call staff</text>
      <text x="16" y="146" font-family="sans-serif" font-size="11" fill="#94A3B8">• Localized alerts</text>
      <text x="16" y="166" font-family="sans-serif" font-size="11" fill="#94A3B8">• Department groups</text>
      <text x="16" y="186" font-family="sans-serif" font-size="11" fill="#94A3B8">• Branch module flags</text>
      <rect x="16" y="218" width="160" height="24" rx="4" fill="#0F172A"/>
      <text x="96" y="234" font-family="sans-serif" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">Regional Scoping</text>
    </g>

    <!-- Panel 4: Client Agency Portal -->
    <g transform="translate(618, 0)">
      <rect width="192" height="260" rx="10" fill="#0B132B" stroke="#A855F7" stroke-width="1.2"/>
      <rect x="0" y="0" width="192" height="38" rx="10" fill="#581C87"/>
      <text x="96" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#E9D5FF" text-anchor="middle">CLIENT PORTAL</text>
      
      <text x="16" y="62" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Route: /client</text>
      <text x="16" y="80" font-family="sans-serif" font-size="11" font-weight="600" fill="#A855F7">Agency Clients</text>
      <text x="16" y="106" font-family="sans-serif" font-size="11" fill="#94A3B8">• Assigned client targets</text>
      <text x="16" y="126" font-family="sans-serif" font-size="11" fill="#94A3B8">• Read-only telemetry</text>
      <text x="16" y="146" font-family="sans-serif" font-size="11" fill="#94A3B8">• Client status pages</text>
      <text x="16" y="166" font-family="sans-serif" font-size="11" fill="#94A3B8">• White-label branding</text>
      <text x="16" y="186" font-family="sans-serif" font-size="11" fill="#94A3B8">• SLA verification</text>
      <rect x="16" y="218" width="160" height="24" rx="4" fill="#0F172A"/>
      <text x="96" y="234" font-family="sans-serif" font-size="10" font-weight="700" fill="#C084FC" text-anchor="middle">Agency MRR Driver</text>
    </g>

    <!-- Panel 5: Support & Operations (NOC) -->
    <g transform="translate(824, 0)">
      <rect width="192" height="260" rx="10" fill="#0B132B" stroke="#EC4899" stroke-width="1.2"/>
      <rect x="0" y="0" width="192" height="38" rx="10" fill="#831843"/>
      <text x="96" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#FBCFE8" text-anchor="middle">NOC / OPS</text>
      
      <text x="16" y="62" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Route: /operations</text>
      <text x="16" y="80" font-family="sans-serif" font-size="11" font-weight="600" fill="#EC4899">SREs & Support</text>
      <text x="16" y="106" font-family="sans-serif" font-size="11" fill="#94A3B8">• Cross-tenant triage</text>
      <text x="16" y="126" font-family="sans-serif" font-size="11" fill="#94A3B8">• Worker queue depths</text>
      <text x="16" y="146" font-family="sans-serif" font-size="11" fill="#94A3B8">• Dead-letter queues</text>
      <text x="16" y="166" font-family="sans-serif" font-size="11" fill="#94A3B8">• Probe agent heartbeats</text>
      <text x="16" y="186" font-family="sans-serif" font-size="11" fill="#94A3B8">• Anomaly isolation</text>
      <rect x="16" y="218" width="160" height="24" rx="4" fill="#0F172A"/>
      <text x="96" y="234" font-family="sans-serif" font-size="10" font-weight="700" fill="#F472B6" text-anchor="middle">High-Throughput Triage</text>
    </g>
  </g>
</svg>

