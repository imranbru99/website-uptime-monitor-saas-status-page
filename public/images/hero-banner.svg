<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigoGlow" cx="50%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="480" fill="url(#bgGradient)" rx="16"/>
  <rect width="1200" height="480" fill="url(#cyanGlow)" rx="16"/>
  <rect width="1200" height="480" fill="url(#emeraldGlow)" rx="16"/>
  <rect width="1200" height="480" fill="url(#indigoGlow)" rx="16"/>

  <!-- Subtle Perspective Grid -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="0.75">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="120" y1="0" x2="120" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="360" y1="0" x2="360" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="720" y1="0" x2="720" y2="480" />
    <line x1="840" y1="0" x2="840" y2="480" />
    <line x1="960" y1="0" x2="960" y2="480" />
    <line x1="1080" y1="0" x2="1080" y2="480" />
  </g>

  <!-- Top Category Pill -->
  <g transform="translate(60, 48)">
    <rect width="320" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#10B981" filter="url(#neonGlow)"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">ENTERPRISE SAAS PLATFORM</text>
    <text x="210" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">• v1.0.0 PRODUCTION</text>
  </g>

  <!-- Title & Headline -->
  <g transform="translate(60, 132)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">Website Uptime Monitor</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="url(#accentGrad)">Infrastructure Observability • Incident Copilot • Public Status Pages</text>
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">One unified platform for synthetic monitoring, automated alerting, multi-branch operations, and agency white-label SaaS.</text>
  </g>

  <!-- Pulse Heartbeat Graphic behind cards -->
  <path d="M 60 265 L 200 265 L 225 240 L 245 295 L 265 210 L 285 305 L 305 255 L 325 270 L 460 270 L 485 245 L 505 300 L 525 215 L 545 310 L 565 260 L 585 270 L 1140 270" fill="none" stroke="url(#pulseLine)" stroke-width="2.5" opacity="0.45" stroke-linecap="round"/>

  <!-- Right Hero Telemetry Card (Glassmorphic) -->
  <g transform="translate(710, 50)" filter="url(#shadow)">
    <rect width="430" height="370" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Card Header -->
    <rect width="430" height="48" rx="16" fill="#1E293B" opacity="0.6"/>
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="42" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="60" cy="24" r="6" fill="#10B981"/>
    <text x="82" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">Global Observability Mesh — Active Probes</text>
    <rect x="335" y="14" width="75" height="20" rx="10" fill="#064E3B"/>
    <text x="347" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34D399">8 NODES</text>

    <!-- Metrics Row 1 -->
    <g transform="translate(24, 70)">
      <rect width="180" height="74" rx="10" fill="#0F172A" stroke="#1E293B"/>
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B">SYSTEM UPTIME (30D)</text>
      <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#10B981">99.998%</text>
      <circle cx="156" cy="46" r="4" fill="#10B981" filter="url(#neonGlow)"/>
    </g>

    <g transform="translate(226, 70)">
      <rect width="180" height="74" rx="10" fill="#0F172A" stroke="#1E293B"/>
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B">AVG RESPONSE TIME</text>
      <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#38BDF8">18.4 ms</text>
      <text x="120" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#059669">P99: 48ms</text>
    </g>

    <!-- Live Monitor Rows -->
    <g transform="translate(24, 162)">
      <!-- Row 1 -->
      <rect width="382" height="42" rx="8" fill="#0F172A" stroke="#1E293B"/>
      <circle cx="18" cy="21" r="5" fill="#10B981" filter="url(#neonGlow)"/>
      <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">api.nimbuscloud.io/health</text>
      <rect x="235" y="11" width="46" height="20" rx="4" fill="#1E293B"/>
      <text x="245" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38BDF8">HTTP</text>
      <text x="300" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">14 ms</text>
      <rect x="345" y="12" width="28" height="18" rx="4" fill="#064E3B"/>
      <text x="350" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#34D399">200</text>

      <!-- Row 2 -->
      <g transform="translate(0, 50)">
        <rect width="382" height="42" rx="8" fill="#0F172A" stroke="#1E293B"/>
        <circle cx="18" cy="21" r="5" fill="#10B981" filter="url(#neonGlow)"/>
        <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">db-cluster.us-east.prod:5432</text>
        <rect x="235" y="11" width="46" height="20" rx="4" fill="#1E293B"/>
        <text x="244" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#A855F7">PGSQL</text>
        <text x="305" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">4 ms</text>
        <rect x="345" y="12" width="28" height="18" rx="4" fill="#064E3B"/>
        <text x="352" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#34D399">UP</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 100)">
        <rect width="382" height="42" rx="8" fill="#0F172A" stroke="#1E293B"/>
        <circle cx="18" cy="21" r="5" fill="#10B981" filter="url(#neonGlow)"/>
        <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Nightly Backup Snitch</text>
        <rect x="235" y="11" width="46" height="20" rx="4" fill="#1E293B"/>
        <text x="240" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#F59E0B">HEART</text>
        <text x="296" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">Cron OK</text>
        <rect x="345" y="12" width="28" height="18" rx="4" fill="#064E3B"/>
        <text x="352" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#34D399">UP</text>
      </g>

      <!-- Mini Sparkline Graph -->
      <g transform="translate(0, 150)">
        <path d="M 0 35 Q 30 15, 60 28 T 120 18 T 180 30 T 240 12 T 300 24 T 360 8 L 382 14" fill="none" stroke="#10B981" stroke-width="2"/>
        <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748B">LATENCY 24H: MIN 3ms • AVG 18.4ms • MAX 32ms</text>
        <text x="280" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34D399">ALL 23 TARGETS UP</text>
      </g>
    </g>
  </g>

  <!-- Bottom Feature Badges Grid -->
  <g transform="translate(60, 310)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="195" height="50" rx="10" fill="#1E293B" stroke="#334155"/>
      <circle cx="25" cy="25" r="12" fill="#065F46"/>
      <text x="20" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#34D399">✓</text>
      <text x="46" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">60 SaaS Modules</text>
      <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Dynamic Registry</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(210, 0)">
      <rect width="195" height="50" rx="10" fill="#1E293B" stroke="#334155"/>
      <circle cx="25" cy="25" r="12" fill="#1E3A8A"/>
      <text x="20" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#60A5FA">⚡</text>
      <text x="46" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">5 Filament Panels</text>
      <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Admin, App, Client, Ops</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(420, 0)">
      <rect width="195" height="50" rx="10" fill="#1E293B" stroke="#334155"/>
      <circle cx="25" cy="25" r="12" fill="#4C1D95"/>
      <text x="20" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C084FC">🤖</text>
      <text x="46" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">AI Copilot & RCA</text>
      <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Laravel AI Hub v1.7</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 60)">
      <rect width="195" height="50" rx="10" fill="#1E293B" stroke="#334155"/>
      <circle cx="25" cy="25" r="12" fill="#701A75"/>
      <text x="20" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#F472B6">🛡️</text>
      <text x="46" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Hardened SSRF Guard</text>
      <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">RFC1918 & Cloud Block</text>
    </g>

    <g transform="translate(210, 60)">
      <rect width="195" height="50" rx="10" fill="#1E293B" stroke="#334155"/>
      <circle cx="25" cy="25" r="12" fill="#14532D"/>
      <text x="20" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#4ADE80">🔔</text>
      <text x="46" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">6 Alert Channels</text>
      <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Slack, Teams, Discord, Webhooks</text>
    </g>

    <g transform="translate(420, 60)">
      <rect width="195" height="50" rx="10" fill="#1E293B" stroke="#334155"/>
      <circle cx="25" cy="25" r="12" fill="#0C4A6E"/>
      <text x="20" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#38BDF8">📊</text>
      <text x="46" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Public Status Pages</text>
      <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">90-Day Bars & Dark Mode</text>
    </g>
  </g>
</svg>
