      <text x="340" y="24" font-family="sans-serif" font-size="13" font-weight="800" fill="#10B981">✓ Included (100% Private)</text>
      <text x="600" y="24" font-family="sans-serif" font-size="12" fill="#EF4444">✕ Cloud Only</text>
      <text x="750" y="24" font-family="sans-serif" font-size="12" fill="#EF4444">✕ Cloud Only</text>
      <text x="900" y="24" font-family="sans-serif" font-size="12" fill="#EF4444">✕ Cloud Only</text>
