<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="360" rx="12" fill="url(#pipeBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Automated Incident Lifecycle & Alert Pipeline</text>
  <text x="40" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">From sub-second synthetic detection to AI root cause analysis and multi-channel instant escalation</text>

  <!-- Flow Track Line -->
  <line x1="80" y1="180" x2="1020" y2="180" stroke="url(#flowGrad)" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Step 1: Probe Detection -->
  <g transform="translate(60, 110)">
    <rect width="160" height="140" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
    <circle cx="80" cy="35" r="20" fill="#7F1D1D"/>
    <text x="73" y="42" font-size="18" fill="#FCA5A5">🔍</text>
    <text x="80" y="80" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">1. PROBE OUTAGE</text>
    <text x="80" y="100" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">HTTP 5xx, TCP timeout,</text>
    <text x="80" y="115" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">or SSL expiration</text>
    <rect x="35" y="125" width="90" height="18" rx="4" fill="#991B1B"/>
    <text x="80" y="137" font-family="sans-serif" font-size="9" font-weight="700" fill="#FEE2E2" text-anchor="middle">SUB-SECOND</text>
  </g>

  <!-- Step 2: FSM Confirmation -->
  <g transform="translate(260, 110)">
    <rect width="160" height="140" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="80" cy="35" r="20" fill="#78350F"/>
    <text x="73" y="42" font-size="18" fill="#FDE68A">⚖️</text>
    <text x="80" y="80" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">2. FSM THRESHOLD</text>
    <text x="80" y="100" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">2nd probe verification</text>
    <text x="80" y="115" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">prevents false alarms</text>
    <rect x="25" y="125" width="110" height="18" rx="4" fill="#92400E"/>
    <text x="80" y="137" font-family="sans-serif" font-size="9" font-weight="700" fill="#FEF3C7" text-anchor="middle">0 FALSE POSITIVES</text>
  </g>

  <!-- Step 3: AI Copilot & RCA -->
  <g transform="translate(460, 110)">
    <rect width="170" height="140" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="85" cy="35" r="20" fill="#4C1D95"/>
    <text x="78" y="42" font-size="18" fill="#DDD6FE">🤖</text>
    <text x="85" y="80" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">3. AI ROOT CAUSE</text>
    <text x="85" y="100" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Diagnostic analysis &</text>
    <text x="85" y="115" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">drafts status update</text>
    <rect x="25" y="125" width="120" height="18" rx="4" fill="#5B21B6"/>
    <text x="85" y="137" font-family="sans-serif" font-size="9" font-weight="700" fill="#EDE9FE" text-anchor="middle">LARAVEL AI HUB</text>
  </g>

  <!-- Step 4: Multi-Channel Dispatch -->
  <g transform="translate(670, 110)">
    <rect width="160" height="140" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="80" cy="35" r="20" fill="#0C4A6E"/>
    <text x="73" y="42" font-size="18" fill="#BAE6FD">📢</text>
    <text x="80" y="80" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">4. DISPATCH MESH</text>
    <text x="80" y="100" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Slack, Teams, Discord,</text>
    <text x="80" y="115" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Telegram, Webhooks</text>
    <rect x="30" y="125" width="100" height="18" rx="4" fill="#075985"/>
    <text x="80" y="137" font-family="sans-serif" font-size="9" font-weight="700" fill="#E0F2FE" text-anchor="middle">ON-CALL NOTIFIED</text>
  </g>

  <!-- Step 5: Auto Recovery & Postmortem -->
  <g transform="translate(870, 110)">
    <rect width="170" height="140" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="85" cy="35" r="20" fill="#064E3B"/>
    <text x="78" y="42" font-size="18" fill="#A7F3D0">🎉</text>
    <text x="85" y="80" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">5. PROBE RECOVERY</text>
    <text x="85" y="100" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Probes confirm health,</text>
    <text x="85" y="115" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">auto-resolves incident</text>
    <rect x="25" y="125" width="120" height="18" rx="4" fill="#065F46"/>
    <text x="85" y="137" font-family="sans-serif" font-size="9" font-weight="700" fill="#D1FAE5" text-anchor="middle">AUTO-RESOLVED</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(40, 290)">
    <text x="0" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#64748B">GUARANTEED RELIABILITY:</text>
    <rect x="180" y="6" width="190" height="26" rx="13" fill="#1E293B"/>
    <text x="195" y="23" font-family="sans-serif" font-size="11" font-weight="700" fill="#10B981">⚡ 94% MTTA Reduction</text>
    
    <rect x="385" y="6" width="220" height="26" rx="13" fill="#1E293B"/>
    <text x="400" y="23" font-family="sans-serif" font-size="11" font-weight="700" fill="#38BDF8">🛡️ Cryptographic Webhook HMAC</text>

    <rect x="620" y="6" width="220" height="26" rx="13" fill="#1E293B"/>
    <text x="635" y="23" font-family="sans-serif" font-size="11" font-weight="700" fill="#A855F7">📄 Automated PDF Postmortems</text>
  </g>
</svg>
